<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title == 'Home' %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#f7f5ef">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/pages.css' | relative_url }}">
    <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header wrap">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">q<span>.</span></a>
      <nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}#work">Work</a><a href="{{ '/' | relative_url }}#about">About</a><a href="{{ '/' | relative_url }}#contact">Contact</a></nav>
      <a class="header-social" href="{{ site.github_url }}" target="_blank" rel="noreferrer">GitHub <span aria-hidden="true">↗</span></a>
    </header>
    {{ content }}
    <footer class="site-footer wrap"><a class="brand" href="{{ '/' | relative_url }}" aria-label="Back to top">q<span>.</span></a><p>Designed & built by Quadri Ganiu Olawale · Lagos, NG</p><a href="mailto:{{ site.email }}">Say hello ↗</a></footer>
  </body>
</html>
